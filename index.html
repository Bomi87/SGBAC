<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SGBAC 예약 현황</title>

  <style>
    /* =========================================================
       기본
       ========================================================= */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f6fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    /* =========================================================
       전체 컨테이너
       ========================================================= */
    .app {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 12px 14px 30px;
    }


    /* =========================================================
       페이지 헤더 / 날짜 조회
       ========================================================= */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 12px;
    }

    .page-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #172033;
    }

    .page-subtitle {
      margin-top: 5px;
      color: #7b8798;
      font-size: 13px;
      font-weight: 500;
    }

    .search-panel {
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .search-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
    }

    .search-controls {
      min-width: 0;
    }

    .sgbac-logo-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      min-width: 0;
    }

    .sgbac-logo {
      display: block;
      width: auto;
      height: 58px;
      max-width: 220px;
      object-fit: contain;
    }

    .search-label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    .search-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
    }

    .date-input {
      width: 220px;
      flex: 0 0 220px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #ffffff;
      color: #1e293b;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    .date-input:focus {
      border-color: #7aa7e8;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.09);
    }

    .search-button {
      width: 76px;
      flex: 0 0 76px;
      height: 40px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(37, 99, 235, 0.18);
    }

    .search-button:hover {
      background: #1d4ed8;
    }

    .search-button:disabled {
      opacity: 0.62;
      cursor: default;
    }

    .png-button {
      width: 92px;
      flex: 0 0 92px;
      height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .png-button:hover {
      background: #eef2f7;
    }

    .png-button:disabled {
      opacity: 0.62;
      cursor: default;
    }

    /* =========================================================
       상단 영역
       ========================================================= */
    .topbar {
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 13px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .data-summary {
      color: #111827;
      font-weight: 800;
      white-space: nowrap;
    }

    .update-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .update-time-text {
      color: #475569;
      font-weight: 400;
      white-space: nowrap;
    }

    /* =========================================================
       상태
       ========================================================= */

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.loading {
      background: #f59e0b;
    }

    .status-dot.error {
      background: #ef4444;
    }

    /* =========================================================
       테이블
       ========================================================= */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: #ffffff;
      border: 1px solid #d8dee6;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    /* =========================================================
       칼럼 너비
       ========================================================= */
    .col-apply {
      width: 165px;
    }

    .col-time {
      width: 118px;
    }

    .col-aircraft {
      width: 100px;
    }

    .col-route {
      width: 205px;
    }

    .col-company {
      width: 165px;
    }

    .col-person {
      width: 120px;
    }

    .col-remark {
      width: 430px;
    }

    .col-cancel {
      width: 58px;
    }

    .col-stand {
      width: 62px;
    }

    .col-actual {
      width: 95px;
    }

    /* =========================================================
       헤더
       ========================================================= */
    .data-table thead th {
      background: #dfeaf4;
      color: #111827;
      font-weight: 700;
      text-align: center;
      height: 34px;
      padding: 7px 5px;
      border-right: 1px solid #cfd8e3;
      border-bottom: 1px solid #cfd8e3;
      white-space: nowrap;
    }

    .data-table thead th:last-child {
      border-right: 0;
    }

    /* =========================================================
       데이터 셀
       ========================================================= */
    .data-table tbody td {
      border-right: 1px solid #e1e6eb;
      border-bottom: 1px solid #e1e6eb;
      padding: 5px 8px;
      vertical-align: top;
      color: #253247;
      font-weight: 500;
      line-height: 1.32;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .data-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .data-table tbody td:last-child {
      border-right: 0;
    }

    /* =========================================================
       가운데 정렬 칼럼
       ========================================================= */
    .apply-cell,
    .aircraft-cell,
    .company-cell,
    .person-cell,
    .cancel-cell,
    .stand-cell,
    .actual-cell {
      text-align: center;
    }

    /* =========================================================
       신청여부 버튼
       ========================================================= */
    .apply-button {
      border: 0;
      min-width: 29px;
      height: 25px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .apply-button:hover {
      transform: translateY(-1px);
    }

    .apply-button:active {
      transform: translateY(0);
    }

    /* O */
    .apply-button.apply-o {
      background: #dcfce7;
      color: #15803d;
    }

    .apply-button.apply-o:hover {
      box-shadow: 0 2px 7px rgba(21, 128, 61, 0.18);
    }

    /* X */
    .apply-button.apply-x {
      background: #fee2e2;
      color: #dc2626;
    }

    .apply-button.apply-x:hover {
      box-shadow: 0 2px 7px rgba(220, 38, 38, 0.18);
    }

    /* =========================================================
       SK텔레콤 국내선 인원수송 신청 가능성 안내
       ========================================================= */
    .apply-guide {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 4px 5px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 800;
      text-align: center;
      white-space: normal;
      word-break: keep-all;
    }

    .apply-guide.guide-available {
      background: #dcfce7;
      color: #15803d !important;
      border: 1px solid #bbf7d0;
    }

    .apply-guide.guide-possible {
      background: #fff7ed;
      color: #c2410c !important;
      border: 1px solid #fed7aa;
    }

    .apply-guide.guide-unavailable {
      background: #fee2e2;
      color: #dc2626 !important;
      border: 1px solid #fecaca;
    }

    .apply-guide-time {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      line-height: 1.25;
      font-weight: 700;
    }

    /* =========================================================
       시간
       ========================================================= */
    .time-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
      white-space: nowrap;
    }

    .time-line {
      display: block;
      font-weight: 500;
    }

    .time-line.expected-line {
      font-weight: 800;
    }

    .time-label {
      font-weight: 700;
    }

    /* =========================================================
       항공기
       ========================================================= */
    .aircraft-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.35;
      white-space: nowrap;
    }

    .aircraft-reg {
      font-weight: 700;
    }

    .aircraft-type {
      font-weight: 500;
    }

    /* =========================================================
       구간
       ========================================================= */
    .route-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1.32;
    }

    .route-main {
      font-weight: 700;
    }

    .route-relative {
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
    }

    .route-purpose {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 22px;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    /* Ferry → 회색 라벨 */
    .route-purpose.purpose-ferry {
      background: #eef1f4;
      border-color: #d8dee6;
      color: #475569 !important;
    }

    /* 인원수송 → 구간 칼럼에서 잘 구분되는 차분한 파란 라벨 */
    .route-purpose.purpose-passenger {
      background: #e8f1fb;
      border-color: #cfdeee;
      color: #1769aa !important;
    }

    /* 그 외 운항목적 → 기본 중립 라벨 */
    .route-purpose.purpose-other {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #475569 !important;
    }

    /* =========================================================
       운항사
       ========================================================= */
    .company-box {
      line-height: 1.4;
    }

    /* =========================================================
       인원
       ========================================================= */
    .person-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.45;
      white-space: nowrap;
    }

    .person-line {
      display: block;
    }

    /* =========================================================
       비고
       ========================================================= */
    .remark-cell {
      text-align: left;
      white-space: pre-line;
      line-height: 1.28;
      font-size: 12px;
      word-break: break-word;
      padding-top: 3px !important;
      padding-bottom: 4px !important;
    }

    .remark-text {
      display: block;
      margin: 0;
      padding: 0;
      white-space: pre-line;
      font-size: inherit;
      line-height: inherit;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }


    /* =========================================================
       조건부서식
       - X : 회색 배경
       - 국제선(I) : 차분한 파란 글씨
       - SK 자가용 : 딥레드 (국제선보다 우선)
       ========================================================= */
    .data-table tbody tr.row-x td {
      background: #eef1f4;
    }

    .data-table tbody tr.row-i td {
      color: #1769aa;
    }

    .data-table tbody tr.row-skt td {
      color: #b23a3a !important;
      font-weight: 650;
    }

    .data-table tbody tr.row-skt .apply-button {
      color: #b23a3a !important;
    }

    /* =========================================================
       취소
       ========================================================= */
    .cancel-y {
      color: #dc2626 !important;
      font-weight: 800 !important;
    }

    .cancel-n {
      color: inherit;
    }

    /* =========================================================
       실제시간
       ========================================================= */
    .actual-cell {
      white-space: nowrap;
    }

    /* =========================================================
       빈 데이터
       ========================================================= */
    .empty-row {
      padding: 45px 20px !important;
      text-align: center !important;
      color: #64748b !important;
      font-weight: 500 !important;
    }

    /* =========================================================
       로딩
       ========================================================= */
    .loading-box {
      padding: 50px 20px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    /* =========================================================
       팝업 배경
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 18px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    /* =========================================================
       팝업
       ========================================================= */
    .modal {
      width: min(620px, 100%);
      max-height: calc(100vh - 36px);
      overflow: hidden;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       팝업 헤더
       ========================================================= */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #e2e8f0;
    }

    /* =========================================================
       팝업 내용
       ========================================================= */
    .modal-body {
      overflow-y: auto;
      padding: 4px 18px 18px;
    }

    /* =========================================================
       팝업 정보
       ========================================================= */
    .detail-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .detail-value {
      color: #1e293b;
      font-size: 14px;
      line-height: 1.45;
      min-width: 0;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* =========================================================
       팝업 시간
       ========================================================= */
    .detail-time {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-expected {
      font-weight: 800;
    }

    /* =========================================================
       팝업 항공기
       ========================================================= */
    .detail-aircraft {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    /* =========================================================
       팝업 구간
       ========================================================= */
    .detail-route {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-route-main {
      font-weight: 700;
    }

    .detail-route-relative {
      color: #64748b;
      font-weight: 400;
    }

    .detail-route-purpose {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 22px;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .detail-route-purpose.purpose-ferry {
      background: #eef1f4;
      border-color: #d8dee6;
      color: #475569;
    }

    .detail-route-purpose.purpose-passenger {
      background: #e8f1fb;
      border-color: #cfdeee;
      color: #1769aa;
    }

    .detail-route-purpose.purpose-other {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #475569;
    }

    /* =========================================================
       팝업 인원
       ========================================================= */
    .detail-person {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* =========================================================
       팝업 비고
       ========================================================= */
    .detail-remark-wrap {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 0;
    }

    .detail-remark {
      margin: 0;
      padding: 0;
      white-space: pre-line;
      color: #334155;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    /* =========================================================
       모바일
       ========================================================= */
    @media (max-width: 800px) {
      .app {
        padding: 10px 8px 20px;
      }

      .page-head {
        margin: 3px 2px 10px;
      }

      .page-title {
        font-size: 22px;
      }

      .page-subtitle {
        font-size: 12px;
      }

      .search-panel {
        padding: 11px 12px;
      }

      .search-main {
        align-items: center;
        gap: 10px;
      }

      .search-controls {
        min-width: 0;
        flex: 1 1 auto;
      }

      .sgbac-logo-wrap {
        flex: 0 0 auto;
        padding-right: 0;
      }

      .sgbac-logo {
        height: 42px;
        max-width: 140px;
      }

      .search-row {
        display: flex;
        width: 100%;
        gap: 7px;
      }

      .date-input {
        width: auto;
        flex: 1 1 auto;
      }

      .search-button {
        width: 72px;
        flex: 0 0 72px;
      }

      .png-button {
        width: 78px;
        flex: 0 0 78px;
        font-size: 12px;
      }

      .date-input,
      .search-button,
      .png-button {
        height: 40px;
      }

      .topbar {
        font-size: 11px;
        padding: 8px 9px;
        min-height: 40px;
      }

      .topbar {
        gap: 10px;
      }

      .data-summary {
        font-size: 11px;
      }

      .update-time-text {
        font-size: 11px;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .data-table {
        min-width: 1280px;
        font-size: 12px;
      }

      .data-table tbody td {
        padding: 6px 7px;
        vertical-align: top;
      }

      .remark-cell {
        font-size: 12px;
        line-height: 1.32;
      }

      .modal-backdrop {
        padding: 0;
      }

      .modal {
        width: 100%;
        height: 100%;
        max-height: 100vh;
        border-radius: 0;
      }

      .modal-header {
        padding: 14px 16px;
      }

      .modal-body {
        padding: 3px 16px 18px;
      }

      .detail-row {
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 10px;
        padding: 9px 0;
      }

      .detail-label {
        font-size: 12px;
      }

      .detail-value {
        font-size: 13px;
      }
    }

    /* =========================================================
       아주 작은 모바일
       ========================================================= */
    @media (max-width: 430px) {
      .sgbac-logo {
        height: 36px;
        max-width: 105px;
      }


      .search-row {
        width: 100%;
      }

      .topbar {
        align-items: center;
      }

      .data-summary {
        min-width: 0;
      }

      .update-right {
        margin-left: auto;
      }

      .status-dot {
        display: none;
      }
    }

    /* =========================================================
       선택 방지
       ========================================================= */
    .apply-button,
    .modal-close {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>
  <div id="authScreen" style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#f3f6fb;
    color:#475569;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;
  ">
    Gmail 계정 승인 확인 중...
  </div>

  <div id="appRoot" style="display:none;">
  <div class="app">

    <!-- =====================================================
         제목
         ====================================================== -->
    <div class="page-head">
      <div>
        <h1 class="page-title">SGBAC 예약현황</h1>
        <div class="page-subtitle">예약 및 운항 현황</div>
      </div>
    </div>

    <!-- =====================================================
         날짜 조회
         ====================================================== -->
    <div class="search-panel">
      <div class="search-main">

        <div class="search-controls">
          <label class="search-label" for="dateInput">조회일</label>

          <div class="search-row">
            <input
              type="date"
              id="dateInput"
              class="date-input"
              aria-label="조회일"
            >

            <button
              type="button"
              id="searchButton"
              class="search-button"
            >
              조회
            </button>

            <button
              type="button"
              id="pngButton"
              class="png-button"
              data-html2canvas-ignore="true"
              title="현재 예약현황을 PNG 파일로 저장"
            >
              PNG 저장
            </button>
          </div>
        </div>

        <div class="sgbac-logo-wrap">
          <img
            src="SGBAC_LOGO.png"
            alt="SGBAC"
            class="sgbac-logo"
          >
        </div>

      </div>
    </div>

    <!-- =====================================================
         갱신 정보
         ====================================================== -->
    <div class="topbar">
      <div class="data-summary" id="dataText">
        DATA 확인 중...
      </div>

      <div class="update-right">
        <span class="update-time-text" id="updateText">
          최종 갱신: 확인 중...
        </span>

        <span class="status-dot loading" id="statusDot"></span>
      </div>
    </div>

    <!-- =====================================================
         테이블
         ====================================================== -->
    <div class="table-wrap">
      <table class="data-table">
        <colgroup>
          <col class="col-apply">
          <col class="col-time">
          <col class="col-aircraft">
          <col class="col-route">
          <col class="col-company">
          <col class="col-person">
          <col class="col-remark">
          <col class="col-cancel">
          <col class="col-stand">
          <col class="col-actual">
        </colgroup>

        <thead>
          <tr>
            <th>신청여부</th>
            <th>시간</th>
            <th>항공기</th>
            <th>구간</th>
            <th>운항사</th>
            <th>인원</th>
            <th>비고</th>
            <th>취소여부</th>
            <th>주기장</th>
            <th>실제시간</th>
          </tr>
        </thead>

        <tbody id="flightBody">
          <tr>
            <td colspan="10" class="loading-box">
              데이터 조회 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- =======================================================
       상세 팝업
       ======================================================== -->
  <div class="modal-backdrop" id="detailModal">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">
          예약 상세
        </div>

        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="닫기"
        >
          ×
        </button>
      </div>

      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    /* =========================================================
       설정
       ========================================================= */

    /*
     * ★★★ 중요 ★★★
     * Apps Script 웹앱 배포 URL을 넣어주세요.
     */
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzyICmjBmXkMmWHPGYg9PJ-mICmjOCT2WB9iOGKQ0OsblBn5u4DOLqXLls3mojEBTvo/exec';

    /*
     * 조회 날짜.
     * 기본값: 오늘 날짜
     * URL에서 ?date=2026-08-29 형식으로 들어오면 해당 날짜 사용.
     */
    const params = new URLSearchParams(window.location.search);
    let targetDate = params.get('date') || getTodayKST();

    /* =========================================================
       DOM
       ========================================================= */

    const dateInput = document.getElementById('dateInput');
    const searchButton = document.getElementById('searchButton');
    const pngButton = document.getElementById('pngButton');
    const flightBody = document.getElementById('flightBody');
    const updateText = document.getElementById('updateText');
    const dataText = document.getElementById('dataText');
    const statusDot = document.getElementById('statusDot');
    const detailModal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    /* =========================================================
       시작
       ========================================================= */

    let SGBAC_APP_STARTED = false;
    let SGBAC_REFRESH_TIMER = null;

    document.addEventListener('DOMContentLoaded', () => {
      initializeDateSelector();
    });

    function startSgbacAppAfterAuth() {
      if (SGBAC_APP_STARTED) return;

      SGBAC_APP_STARTED = true;

      initializeDateSelector();
      loadFlights();

      /*
        인증된 사용자에게만 30분 자동 새로고침 시작
      */
      if (!SGBAC_REFRESH_TIMER) {
        SGBAC_REFRESH_TIMER = setInterval(() => {
          loadFlights();
        }, 30 * 60 * 1000);
      }
    }

    /* =========================================================
       오늘 날짜 KST
       ========================================================= */

    function getTodayKST() {
      const now = new Date();

      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(now);
    }


    /* =========================================================
       날짜 선택 범위 : 오늘 ~ 오늘+6일
       날짜를 바꾸는 것만으로는 조회하지 않고,
       반드시 조회 버튼을 눌렀을 때만 데이터를 읽습니다.
       ========================================================= */

    function initializeDateSelector() {
      const today = getTodayKST();
      const maxDate = addDaysToDateText(today, 6);

      dateInput.min = today;
      dateInput.max = maxDate;

      if (targetDate < today || targetDate > maxDate) {
        targetDate = today;
      }

      dateInput.value = targetDate;
    }

    function addDaysToDateText(dateText, days) {
      const parts = String(dateText).split('-').map(Number);
      const date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      date.setUTCDate(date.getUTCDate() + days);

      const yyyy = date.getUTCFullYear();
      const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(date.getUTCDate()).padStart(2, '0');

      return `${yyyy}-${mm}-${dd}`;
    }

    searchButton.addEventListener('click', () => {
      const selected = dateInput.value;

      if (!selected) {
        return;
      }

      targetDate = selected;

      const url = new URL(window.location.href);
      url.searchParams.set('date', targetDate);
      history.replaceState(null, '', url);

      loadFlights();
    });


    /* =========================================================
       PNG 저장
       - 현재 조회 중인 SGBAC 예약현황 전체를 PNG 1장으로 저장
       - 모바일에서도 가로로 숨겨진 테이블 전체 폭을 포함
       - PNG 저장 버튼 자체는 이미지에 포함하지 않음
       ========================================================= */

    pngButton.addEventListener('click', exportCurrentViewToPng);

    async function exportCurrentViewToPng() {
      if (typeof html2canvas !== 'function') {
        alert('PNG 저장 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
        return;
      }

      pngButton.disabled = true;
      const originalText = pngButton.textContent;
      pngButton.textContent = '저장 중...';

      let captureWrap = null;

      try {
        const sourceApp = document.querySelector('.app');
        const sourceTable = sourceApp.querySelector('.data-table');

        if (!sourceApp || !sourceTable) {
          throw new Error('capture_target_missing');
        }

        /*
          모바일에서는 table-wrap 내부에 가로 스크롤이 생기므로,
          복제본을 충분히 넓게 만들어 전체 테이블이 잘리지 않게 합니다.
        */
        const tableWidth = Math.max(
          sourceTable.scrollWidth || 0,
          sourceTable.offsetWidth || 0,
          1280
        );

        const captureWidth = Math.max(
          tableWidth + 28,
          1280
        );

        captureWrap = document.createElement('div');
        captureWrap.style.position = 'fixed';
        captureWrap.style.left = '-100000px';
        captureWrap.style.top = '0';
        captureWrap.style.width = captureWidth + 'px';
        captureWrap.style.background = '#f3f6fb';
        captureWrap.style.zIndex = '-1';

        const clone = sourceApp.cloneNode(true);

        clone.style.width = captureWidth + 'px';
        clone.style.maxWidth = 'none';
        clone.style.margin = '0';
        clone.style.background = '#f3f6fb';

        const cloneTableWrap = clone.querySelector('.table-wrap');
        const cloneTable = clone.querySelector('.data-table');

        if (cloneTableWrap) {
          cloneTableWrap.style.overflow = 'visible';
        }

        if (cloneTable) {
          cloneTable.style.width = '100%';
          cloneTable.style.minWidth = '0';
        }

        /*
          복제본 안에서 불필요한 인터랙션 요소를 비활성화.
          data-html2canvas-ignore 속성이 있는 PNG 버튼은 자동 제외됨.
        */
        clone.querySelectorAll('button').forEach(button => {
          button.style.pointerEvents = 'none';
        });

        captureWrap.appendChild(clone);
        document.body.appendChild(captureWrap);

        /*
          로고 등 이미지가 로딩될 시간을 조금 보장.
        */
        await waitForCaptureImages(clone);

        const canvas = await html2canvas(clone, {
          backgroundColor: '#f3f6fb',
          scale: 2,
          useCORS: true,
          allowTaint: false,
          logging: false,
          windowWidth: captureWidth,
          scrollX: 0,
          scrollY: 0
        });

        const fileDate = String(targetDate || getTodayKST())
          .replace(/-/g, '');

        const filename =
          'SGBAC_예약현황_' +
          fileDate +
          '.png';

        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        link.remove();

      } catch (error) {
        console.error('PNG 저장 오류', error);
        alert('PNG 파일 저장에 실패했습니다.');
      } finally {
        if (captureWrap && captureWrap.parentNode) {
          captureWrap.parentNode.removeChild(captureWrap);
        }

        pngButton.disabled = false;
        pngButton.textContent = originalText;
      }
    }

    function waitForCaptureImages(root) {
      const images = Array.from(root.querySelectorAll('img'));

      if (!images.length) {
        return Promise.resolve();
      }

      return Promise.all(
        images.map(img => {
          if (img.complete) {
            return Promise.resolve();
          }

          return new Promise(resolve => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });

            setTimeout(resolve, 2000);
          });
        })
      );
    }

    /* =========================================================
       데이터 조회
       ========================================================= */

    async function loadFlights() {
      setStatus('loading');
      searchButton.disabled = true;

      flightBody.innerHTML = `
        <tr>
          <td colspan="10" class="loading-box">
            데이터 조회 중...
          </td>
        </tr>
      `;

      try {
        const url =
          API_URL +
          '?action=cache&date=' +
          encodeURIComponent(targetDate);

        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || 'cache_error');
        }

        if (data.status === 'NO_CACHE') {
          renderEmpty();
          updateHeader('', 0);
          setStatus('error');
          return;
        }

        let flights = Array.isArray(data.flights)
          ? data.flights
          : [];

        /* 프론트에서도 한 번 더 정렬. */
        flights = sortFlights(flights);

        renderFlights(flights);
        updateHeader(data.updatedAt || '', flights.length);
        setStatus('ready');

      } catch (error) {
        console.error(error);

        flightBody.innerHTML = `
          <tr>
            <td colspan="10" class="empty-row">
              데이터를 불러오지 못했습니다.
            </td>
          </tr>
        `;

        updateHeader('', 0);
        setStatus('error');
      } finally {
        searchButton.disabled = false;
      }
    }

    /* =========================================================
       정렬
       ========================================================= */

    function sortFlights(flights) {
      return [...flights].sort((a, b) => {
        const aApplied = String(a.applied || '').toUpperCase();
        const bApplied = String(b.applied || '').toUpperCase();

        /* O 먼저 */
        if (aApplied !== bApplied) {
          return aApplied === 'O' ? -1 : 1;
        }

        /* 예정시간 기준 */
        if (aApplied === 'O') {
          return compareTime(a.ett, b.ett);
        }

        /* 계획시간 기준 */
        return compareTime(a.stt, b.stt);
      });
    }

    /* =========================================================
       시간 비교
       ========================================================= */

    function compareTime(a, b) {
      const aa = normalizeTimeForSort(a);
      const bb = normalizeTimeForSort(b);

      return aa.localeCompare(bb);
    }

    function normalizeTimeForSort(value) {
      const text = String(value || '');
      const match = text.match(/(\d{1,2}):(\d{2})/);

      if (!match) {
        return '99:99';
      }

      return (
        match[1].padStart(2, '0') +
        ':' +
        match[2]
      );
    }

    /* =========================================================
       테이블 출력
       ========================================================= */

    function renderFlights(flights) {
      if (flights.length === 0) {
        renderEmpty();
        return;
      }

      /*
       * 에스케이텔레콤 국내선 인원수송편에 대해서만
       * 주변 국제선 운항편과의 시간차를 계산해 신청 가능성 표시.
       */
      const applicationGuides =
        buildApplicationGuides(flights);

      flightBody.innerHTML = flights
        .map(
          (flight, index) =>
            createFlightRow(
              flight,
              index,
              applicationGuides[index]
            )
        )
        .join('');

      /* 팝업 버튼 이벤트 */
      document
        .querySelectorAll('.apply-button')
        .forEach(button => {
          button.addEventListener('click', () => {
            const index = Number(button.dataset.index);
            openDetail(flights[index]);
          });
        });
    }

    /* =========================================================
       행 생성
       ========================================================= */

    function createFlightRow(f, index, applicationGuide) {
      const applied = String(f.applied || '')
        .trim()
        .toUpperCase();

      const applyClass =
        applied === 'X' ? 'apply-x' : 'apply-o';

      const applyText =
        applied === 'X' ? 'X' : 'O';

      const applicationGuideHtml =
        buildApplicationGuideHtml(
          applicationGuide
        );

      /* 조건부서식 */
      const tof = String(f.tof || '').trim().toUpperCase();
      const companyRaw = String(f.company || '').trim();
      const rowClasses = [];

      if (applied === 'X') {
        rowClasses.push('row-x');
      }

      if (tof === 'I') {
        rowClasses.push('row-i');
      }

      if (companyRaw === '에스케이텔레콤(주)-자가용') {
        rowClasses.push('row-skt');
      }

      /* 시간 */
      const planned = formatKST(f.stt);
      const expected = formatKST(f.ett);

      /* 항공기 */
      const aircraftReg = safe(f.reg);
      const aircraftType = safe(f.type);

      /* 구간 */
      const route = buildRoute(f);

      /* 운항사 */
      const company = safe(f.company);

      /* 인원 */
      const crew = displayNumber(f.crew);
      const pax = displayNumber(f.pax);
      const baggage = displayNumber(f.baggage);

      /* 비고 */
      const remark = cleanRemark(f.remark);

      /* 취소 */
      const cancel = safe(f.cancel).toUpperCase();
      const cancelClass =
        cancel === 'Y' ? 'cancel-y' : 'cancel-n';

      /* 주기장 */
      const stand = safe(f.stand);

      /* 실제시간 */
      const actual = formatKST(f.att);

      return `
        <tr class="${rowClasses.join(' ')}">
          <!-- 신청여부 -->
          <td class="apply-cell">
            <button
              type="button"
              class="apply-button ${applyClass}"
              data-index="${index}"
            >
              ${applyText}
            </button>
            ${applicationGuideHtml}
          </td>

          <!-- 시간 -->
          <td>
            <div class="time-box">
              <span class="time-line planned-line">
                -계획: ${planned}
              </span>

              <span class="time-line expected-line">
                -예정: ${expected}
              </span>
            </div>
          </td>

          <!-- 항공기 -->
          <td class="aircraft-cell">
            <div class="aircraft-box">
              <span class="aircraft-reg">
                ${aircraftReg}
              </span>

              ${
                aircraftType
                  ? `
                    <span class="aircraft-type">
                      (${aircraftType})
                    </span>
                  `
                  : ''
              }
            </div>
          </td>

          <!-- 구간 -->
          <td>
            ${route}
          </td>

          <!-- 운항사 -->
          <td class="company-cell">
            <div class="company-box">
              ${company}
            </div>
          </td>

          <!-- 인원 -->
          <td class="person-cell">
            <div class="person-box">
              <span class="person-line">
                -승무원 : ${crew}
              </span>

              <span class="person-line">
                -승객 : ${pax}
              </span>

              <span class="person-line">
                -수화물 : ${baggage}
              </span>
            </div>
          </td>

          <!-- 비고 -->
          <td class="remark-cell"><div class="remark-text">${remark}</div></td>

          <!-- 취소 -->
          <td class="cancel-cell ${cancelClass}">
            ${cancel}
          </td>

          <!-- 주기장 -->
          <td class="stand-cell">
            ${stand}
          </td>

          <!-- 실제시간 -->
          <td class="actual-cell">
            ${actual}
          </td>
        </tr>
      `;
    }

    /* =========================================================
       구간 만들기
       ========================================================= */

    function buildRoute(f) {
      /*
       * 백엔드에서 route가 BSL-GMP로 내려오는 경우.
       */
      const route = safe(f.route);

      /*
       * 이미 백엔드에서 전체 문장을 내려주는 경우도 대응.
       */
      const purpose = cleanPurpose(f.purpose);

      /*
       * 상대공항 기존 데이터의 route가 상대공항 정보를
       * 이미 포함하면 그대로 사용.
       *
       * 예:
       * BSL-GMP / 국제선 도착 (상대공항: 스위스)
       */
      let mainRoute = route;

      /*
       * 혹시 route가 단순히 BSL-GMP만 오는 경우에는
       * aod / tof를 이용해서 보완.
       */
      if (mainRoute && !mainRoute.includes('/')) {
        const aod = String(f.aod || '')
          .trim()
          .toUpperCase();

        const tof = String(f.tof || '').trim().toUpperCase();

        let flightTypeText = '';
        if (tof === 'I') {
          flightTypeText = '국제선';
        } else if (tof === 'D') {
          flightTypeText = '국내선';
        }

        let arrivalDeparture = '';

        if (aod === 'A' || aod === '도착') {
          arrivalDeparture = flightTypeText
            ? flightTypeText + ' 도착'
            : '도착';
        } else if (aod === 'D' || aod === '출발') {
          arrivalDeparture = flightTypeText
            ? flightTypeText + ' 출발'
            : '출발';
        }

        if (arrivalDeparture) {
          mainRoute =
            route +
            ' / ' +
            arrivalDeparture;
        }
      }

      /*
       * route에 줄바꿈이 들어있는 경우 안전하게 처리.
       */
      mainRoute = escapeHtml(mainRoute)
        .replace(/\n/g, '<br>');

      const relativeAirport = safe(f.nation);

      return `
        <div class="route-box">
          <span class="route-main">
            ${mainRoute}
          </span>

          ${
            relativeAirport
              ? `
                <span class="route-relative">
                  (상대공항: ${escapeHtml(relativeAirport)})
                </span>
              `
              : ''
          }

          ${
            purpose
              ? `
                <span class="route-purpose ${purposeBadgeClass(purpose)}">
                  ${escapeHtml(purpose)}
                </span>
              `
              : ''
          }
        </div>
      `;
    }

    /* =========================================================
       팝업
       ========================================================= */

    function openDetail(f) {
      const planned = formatKST(f.stt);
      const expected = formatKST(f.ett);
      const actual = formatKST(f.att);

      const route = buildRouteForModal(f);

      const crew = displayNumber(f.crew);
      const pax = displayNumber(f.pax);
      const baggage = displayNumber(f.baggage);

      const remark = cleanRemark(f.remark);

      modalBody.innerHTML = `
        <!-- 시간 -->
        <div class="detail-row">
          <div class="detail-label">
            시간
          </div>

          <div class="detail-value">
            <div class="detail-time">
              <div>
                -계획: ${escapeHtml(planned)}
              </div>

              <div class="detail-expected">
                -예정: ${escapeHtml(expected)}
              </div>

              ${
                actual
                  ? `
                    <div>
                      -실제: ${escapeHtml(actual)}
                    </div>
                  `
                  : ''
              }
            </div>
          </div>
        </div>

        <!-- 항공기 -->
        <div class="detail-row">
          <div class="detail-label">
            항공기
          </div>

          <div class="detail-value">
            <div class="detail-aircraft">
              <div>
                ${escapeHtml(f.reg || '')}
              </div>

              ${
                f.type
                  ? `
                    <div>
                      (${escapeHtml(f.type)})
                    </div>
                  `
                  : ''
              }
            </div>
          </div>
        </div>

        <!-- 구간 -->
        <div class="detail-row">
          <div class="detail-label">
            구간
          </div>

          <div class="detail-value">
            ${route}
          </div>
        </div>

        <!-- 운항사 -->
        <div class="detail-row">
          <div class="detail-label">
            운항사
          </div>

          <div class="detail-value">
            ${escapeHtml(f.company || '')}
          </div>
        </div>

        <!-- 인원 -->
        <div class="detail-row">
          <div class="detail-label">
            인원
          </div>

          <div class="detail-value">
            <div class="detail-person">
              <div>
                -승무원 : ${escapeHtml(crew)}
              </div>

              <div>
                -승객 : ${escapeHtml(pax)}
              </div>

              <div>
                -수화물 : ${escapeHtml(baggage)}
              </div>
            </div>
          </div>
        </div>

        <!-- 비고 -->
        <div class="detail-row">
          <div class="detail-label">
            비고
          </div>

          <div class="detail-value">
            <div class="detail-remark-wrap"><div class="detail-remark">${escapeHtml(remark || '비고 없음')}</div></div>
          </div>
        </div>
      `;

      detailModal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    /* =========================================================
       팝업 구간
       ========================================================= */

    function buildRouteForModal(f) {
      const route = safe(f.route);
      const purpose = cleanPurpose(f.purpose);

      let mainRoute = route;

      if (mainRoute && !mainRoute.includes('/')) {
        const aod = String(f.aod || '')
          .trim()
          .toUpperCase();

        const tof = String(f.tof || '').trim().toUpperCase();

        let flightTypeText = '';
        if (tof === 'I') {
          flightTypeText = '국제선';
        } else if (tof === 'D') {
          flightTypeText = '국내선';
        }

        let text = '';

        if (aod === 'A' || aod === '도착') {
          text = flightTypeText
            ? flightTypeText + ' 도착'
            : '도착';
        } else if (aod === 'D' || aod === '출발') {
          text = flightTypeText
            ? flightTypeText + ' 출발'
            : '출발';
        }

        if (text) {
          mainRoute =
            route +
            ' / ' +
            text;
        }
      }

      const relativeAirport = safe(f.nation);

      return `
        <div class="detail-route">
          <div class="detail-route-main">
            ${escapeHtml(mainRoute)}
          </div>

          ${
            relativeAirport
              ? `
                <div class="detail-route-relative">
                  (상대공항: ${escapeHtml(relativeAirport)})
                </div>
              `
              : ''
          }

          ${
            purpose
              ? `
                <div class="detail-route-purpose ${purposeBadgeClass(purpose)}">
                  ${escapeHtml(purpose)}
                </div>
              `
              : ''
          }
        </div>
      `;
    }

    /* =========================================================
       팝업 닫기
       ========================================================= */

    function closeModal() {
      detailModal.classList.remove('show');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);

    detailModal.addEventListener('click', event => {
      if (event.target === detailModal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeModal();
      }
    });

    /* =========================================================
       빈 데이터
       ========================================================= */

    function renderEmpty() {
      flightBody.innerHTML = `
        <tr>
          <td colspan="10" class="empty-row">
            조회된 예약 데이터가 없습니다.
          </td>
        </tr>
      `;
    }

    /* =========================================================
       상단 갱신시간
       ========================================================= */

    function updateHeader(updatedAt, count) {
      let formatted = formatUpdatedAt(updatedAt);

      if (!formatted) {
        formatted = '-';
      }

      updateText.textContent =
        '최종 갱신: ' + formatted;

      dataText.textContent =
        targetDate +
        ' DATA ' +
        count +
        '건 추출';
    }

    /* =========================================================
       갱신시간 포맷
       ========================================================= */

    function formatUpdatedAt(value) {
      if (!value) {
        return '';
      }

      const text = String(value).trim();

      /*
       * Apps Script의 yyyy-MM-dd HH:mm:ss 형태 대응.
       */
      let match = text.match(
        /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/
      );

      if (match) {
        return (
          match[1] +
          '-' +
          match[2] +
          '-' +
          match[3] +
          ' ' +
          match[4] +
          ':' +
          match[5] +
          ' KST'
        );
      }

      /*
       * ISO 형태 대응.
       */
      const date = new Date(text);

      if (!isNaN(date.getTime())) {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Seoul',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(date);

        const get = type => {
          const item = parts.find(
            p => p.type === type
          );

          return item ? item.value : '';
        };

        return (
          get('year') +
          '-' +
          get('month') +
          '-' +
          get('day') +
          ' ' +
          get('hour') +
          ':' +
          get('minute') +
          ' KST'
        );
      }

      return text;
    }

    /* =========================================================
       29AUG
       ========================================================= */

    function formatDayCode(dateText) {
      const match = String(dateText || '').match(
        /^\d{4}-(\d{2})-(\d{2})$/
      );

      if (!match) {
        return '';
      }

      const month = Number(match[1]);
      const day = match[2];

      const names = [
        'JAN',
        'FEB',
        'MAR',
        'APR',
        'MAY',
        'JUN',
        'JUL',
        'AUG',
        'SEP',
        'OCT',
        'NOV',
        'DEC'
      ];

      return (
        day +
        names[month - 1]
      );
    }

    /* =========================================================
       시간 KST
       ========================================================= */

    function formatKST(value) {
      if (value === null || value === undefined) {
        return '';
      }

      const text = String(value).trim();

      if (!text) {
        return '';
      }

      /*
       * 이미 KST가 붙어있으면 유지.
       */
      if (/KST$/i.test(text)) {
        return text;
      }

      /*
       * HH:MM
       */
      const match = text.match(
        /^(\d{1,2}):(\d{2})$/
      );

      if (match) {
        return (
          match[1].padStart(2, '0') +
          ':' +
          match[2] +
          ' KST'
        );
      }

      /*
       * HHMM
       */
      const compact = text.match(
        /^(\d{3,4})$/
      );

      if (compact) {
        const raw = compact[1].padStart(4, '0');

        return (
          raw.substring(0, 2) +
          ':' +
          raw.substring(2, 4) +
          ' KST'
        );
      }

      return text;
    }

    /* =========================================================
       숫자 표시
       ========================================================= */

    /* =========================================================
       SK텔레콤 국내선 인원수송 신청 가능성 계산

       적용 대상
       - 운항사명에 "에스케이텔레콤" 포함
       - 국내선 (tof = D)
       - 출발 또는 도착 (aod = D/A)
       - 운항목적 = 인원수송

       비교 시간
       - 예정시간(ETT)이 있으면 예정시간 우선
       - 예정시간이 없으면 계획시간(STT)

       판정
       1) 신청된 국제선(O)이 2시간 미만 → 신청불가
       2) 위 조건은 없고 미신청 국제선(X)이 2시간 미만
          → 신청가능 + "(HH:MM KST 국제선 가능성)"
       3) 그 외 → 신청가능
       ========================================================= */

    function buildApplicationGuides(flights) {
      const internationalFlights = flights
        .map((flight, index) => ({
          flight,
          index,
          timeMinutes: getPriorityTimeMinutes(flight)
        }))
        .filter(item => {
          const tof = String(
            item.flight.tof || ''
          )
            .trim()
            .toUpperCase();

          return (
            tof === 'I' &&
            item.timeMinutes !== null
          );
        });

      return flights.map(flight => {
        if (!isSktDomesticPassengerFlight(flight)) {
          return null;
        }

        const targetMinutes =
          getPriorityTimeMinutes(flight);

        if (targetMinutes === null) {
          return null;
        }

        const nearby = internationalFlights
          .map(item => {
            const diff =
              Math.abs(
                targetMinutes -
                item.timeMinutes
              );

            return {
              ...item,
              diff
            };
          })
          .filter(item => item.diff < 120);

        /*
         * 이미 신청된 국제선(O)이 2시간 미만이면
         * 다른 조건보다 우선해서 신청불가.
         */
        const appliedInternational = nearby
          .filter(item => {
            return (
              String(
                item.flight.applied || ''
              )
                .trim()
                .toUpperCase() === 'O'
            );
          })
          .sort((a, b) => a.diff - b.diff);

        if (appliedInternational.length > 0) {
          return {
            status: 'unavailable',
            text: '신청불가'
          };
        }

        /*
         * 미신청 국제선(X)이 2시간 미만이면
         * 가장 가까운 국제선 시간을 가능성 시간으로 표시.
         */
        const unappliedInternational = nearby
          .filter(item => {
            return (
              String(
                item.flight.applied || ''
              )
                .trim()
                .toUpperCase() === 'X'
            );
          })
          .sort((a, b) => a.diff - b.diff);

        if (unappliedInternational.length > 0) {
          const nearest =
            unappliedInternational[0].flight;

          return {
            status: 'possible',
            text: '신청가능',
            timeText:
              getPriorityTimeText(nearest)
          };
        }

        /*
         * 주변 2시간 미만 국제선 충돌 없음.
         * 정확히 2시간(120분)은 "2시간 이상"이므로 신청가능.
         */
        return {
          status: 'available',
          text: '신청가능'
        };
      });
    }


    function isSktDomesticPassengerFlight(flight) {
      const company =
        String(flight.company || '')
          .trim();

      const tof =
        String(flight.tof || '')
          .trim()
          .toUpperCase();

      const aod =
        String(flight.aod || '')
          .trim()
          .toUpperCase();

      const purpose =
        String(flight.purpose || '')
          .trim()
          .replace(/^\*+\s*/, '');

      const isSkt =
        company.includes(
          '에스케이텔레콤'
        );

      const isDomestic =
        tof === 'D';

      const isDepartureOrArrival =
        aod === 'D' ||
        aod === 'A';

      const isPassenger =
        purpose.includes('인원수송') ||
        purpose.includes('인원 수송');

      return (
        isSkt &&
        isDomestic &&
        isDepartureOrArrival &&
        isPassenger
      );
    }


    function getPriorityTimeMinutes(flight) {
      const expected =
        parseTimeMinutes(flight.ett);

      if (expected !== null) {
        return expected;
      }

      return parseTimeMinutes(
        flight.stt
      );
    }


    function getPriorityTimeText(flight) {
      const expected =
        parseTimeMinutes(flight.ett);

      if (expected !== null) {
        return minutesToHHMM(expected);
      }

      const planned =
        parseTimeMinutes(flight.stt);

      if (planned !== null) {
        return minutesToHHMM(planned);
      }

      return '';
    }


    function parseTimeMinutes(value) {
      const text =
        String(value || '').trim();

      const match =
        text.match(
          /(\d{1,2}):(\d{2})/
        );

      if (!match) {
        return null;
      }

      const hour =
        Number(match[1]);

      const minute =
        Number(match[2]);

      if (
        !Number.isInteger(hour) ||
        !Number.isInteger(minute) ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
      ) {
        return null;
      }

      return hour * 60 + minute;
    }


    function minutesToHHMM(minutes) {
      const hour =
        Math.floor(minutes / 60);

      const minute =
        minutes % 60;

      return (
        String(hour).padStart(2, '0') +
        ':' +
        String(minute).padStart(2, '0')
      );
    }


    function buildApplicationGuideHtml(guide) {
      if (!guide) {
        return '';
      }

      if (guide.status === 'unavailable') {
        return `
          <span class="apply-guide guide-unavailable">
            신청불가
          </span>
        `;
      }

      if (guide.status === 'possible') {
        const timeText =
          escapeHtml(
            guide.timeText || ''
          );

        return `
          <span class="apply-guide guide-possible">
            신청가능
            <span class="apply-guide-time">
              (${timeText} KST 국제선 가능성)
            </span>
          </span>
        `;
      }

      return `
        <span class="apply-guide guide-available">
          신청가능
        </span>
      `;
    }


    function displayNumber(value) {
      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return '0';
      }

      const n = Number(value);

      if (Number.isFinite(n)) {
        return String(n);
      }

      return String(value);
    }


    /* =========================================================
       운항목적 Badge
       ========================================================= */

    function purposeBadgeClass(value) {
      const text = String(value || '')
        .trim()
        .toLowerCase();

      if (text.includes('ferry')) {
        return 'purpose-ferry';
      }

      if (
        text.includes('인원수송') ||
        text.includes('인원 수송')
      ) {
        return 'purpose-passenger';
      }

      return 'purpose-other';
    }

    /* =========================================================
       목적 정리
       ========================================================= */

    function cleanPurpose(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return '';
      }

      let text = String(value).trim();

      /*
       * 이미 *가 붙어서 들어오는 경우 중복 방지.
       */
      text = text.replace(/^\*+\s*/, '');

      return text;
    }


    /* =========================================================
       비고 정리
       - 줄바꿈은 유지
       - 불필요하게 연속된 빈 줄은 압축
       - 각 줄 앞뒤의 과도한 공백은 제거
       ========================================================= */

    function cleanRemark(value) {
      if (value === null || value === undefined) {
        return '';
      }

      return String(value)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split('\n')
        .map(line => line.trim())
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    /* =========================================================
       안전 문자열
       ========================================================= */

    function safe(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return '';
      }

      return String(value).trim();
    }

    /* =========================================================
       HTML escape
       ========================================================= */

    function escapeHtml(value) {
      return String(
        value === null || value === undefined
          ? ''
          : value
      )
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* =========================================================
       상태 표시
       ========================================================= */

    function setStatus(status) {
      statusDot.className = 'status-dot';

      if (status === 'loading') {
        statusDot.classList.add('loading');
      } else if (status === 'error') {
        statusDot.classList.add('error');
      }
    }

    /* =========================================================
       자동 갱신
       =========================================================
       캐시는 백엔드에서 갱신되고,
       프론트는 30분마다 다시 읽습니다.
       페이지를 열어둔 상태에서도 최신 CACHE를 자동 반영.
       ========================================================= */


    /*
      common-auth.js가 현재 SGBAC 앱 권한을 승인한 경우에만 시작.
    */
    (function waitForPortalAuth() {
      if (window.CURRENT_PORTAL_USER) {
        startSgbacAppAfterAuth();
        return;
      }

      setTimeout(waitForPortalAuth, 200);
    })();

  </script>
