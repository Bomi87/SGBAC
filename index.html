<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SGBAC 예약현황</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;

      background: #fff;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 12px;

      border: 1px solid #ddd;
    }

    .search-box label {
      font-weight: 700;
    }

    input[type="date"] {
      height: 42px;
      padding: 0 12px;

      font-size: 16px;

      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      height: 42px;
      padding: 0 20px;

      font-size: 15px;
      font-weight: 700;

      border: 0;
      border-radius: 6px;

      cursor: pointer;

      background: #2563eb;
      color: #fff;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .info-box {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;

      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;

      padding: 10px 14px;
      margin-bottom: 12px;

      font-size: 14px;
    }

    .update-time {
      font-weight: 700;
    }

    .status {
      color: #555;
    }

    .table-wrap {
      overflow-x: auto;

      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 2100px;

      border-collapse: collapse;

      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      border-right: 1px solid #eee;

      padding: 7px 8px;

      text-align: center;

      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;

      background: #dce6f1;

      font-weight: 700;

      z-index: 2;

      vertical-align: middle;
    }

    /*======================================================
      데이터 영역
    ======================================================*/

    tbody td {
      padding-top: 6px;
      padding-bottom: 6px;

      /*
        비고가 길어서 행 높이가 커져도
        다른 셀들이 가운데 붕 뜨지 않도록
      */
      vertical-align: top;
    }

    tbody tr {
      height: auto;
    }

    /*======================================================
      비고
    ======================================================*/

    td.remark {
      min-width: 560px;
      width: 560px;
      max-width: 760px;

      /*
        원래 줄바꿈은 살리고
        불필요한 연속 공백은 그대로 늘리지 않음
      */
      white-space: pre-line;

      word-break: break-word;
      overflow-wrap: anywhere;

      text-align: left;
      vertical-align: top;

      line-height: 1.3;

      padding: 6px 9px;
    }

    /*======================================================
      신청 여부 Badge
    ======================================================*/

    .badge {
      display: inline-flex;

      min-width: 32px;
      height: 26px;

      align-items: center;
      justify-content: center;

      border-radius: 6px;

      font-weight: 700;
    }

    .badge-o {
      background: #dcfce7;
      color: #166534;
    }

    .badge-x {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: #666;
    }

    /*======================================================
      Excel 조건부서식 반영
    ======================================================*/

    /* 신청여부 X → 회색 배경 */
    .flight-row-x {
      background: #d9d9d9;
    }

    .flight-row-x td {
      background: transparent;
    }

    /* 국제선 I → 파란 글씨 */
    .flight-row-i {
      color: #0066cc;
    }

    .flight-row-i td {
      color: #0066cc;
    }

    /* SK 자가용 → 부드러운 딥레드 */
    .flight-row-skt {
      color: #c62828 !important;
      font-weight: 600;
    }

    .flight-row-skt td {
      color: #c62828 !important;
    }

    .flight-row-skt .badge {
      color: #c62828 !important;
    }

    /* SK + 국제선이면 빨간색 우선 */
    .flight-row-i.flight-row-skt td {
      color: #c62828 !important;
    }

    /*======================================================
      모바일
    ======================================================*/

    @media (max-width: 700px) {

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 20px;
      }

      .search-box {
        align-items: stretch;
      }

      input[type="date"],
      button {
        width: 100%;
      }

      /*
        모바일도 PC와 동일하게 상단 정렬
      */
      tbody td {
        vertical-align: top;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      td.remark {
        min-width: 420px;
        width: 420px;

        vertical-align: top;

        line-height: 1.3;
        padding: 6px 8px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <h1>SGBAC 예약현황</h1>

  <div class="search-box">

    <label for="dateInput">
      조회일
    </label>

    <input
      id="dateInput"
      type="date"
    >

    <button id="searchBtn">
      조회
    </button>

  </div>


  <div class="info-box">

    <div
      id="updateTime"
      class="update-time"
    >
      최종 갱신: -
    </div>

    <div
      id="status"
      class="status"
    >
      날짜를 선택한 후 조회 버튼을 눌러주세요.
    </div>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>신청여부</th>
          <th>계획시간</th>
          <th>예정시간</th>
          <th>등록기호</th>
          <th>기종</th>
          <th>국가</th>
          <th>구간</th>
          <th>출도착</th>
          <th>국내/국제</th>
          <th>운항목적</th>
          <th>운항사</th>
          <th>승무원</th>
          <th>승객</th>
          <th>수하물</th>
          <th>비고</th>
          <th>취소여부</th>
          <th>주기장</th>
          <th>실제시간</th>
        </tr>

      </thead>


      <tbody id="resultBody">

        <tr>

          <td
            colspan="18"
            class="empty"
          >
            조회 결과가 없습니다.
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

  //========================================================
  // Apps Script Backend
  //========================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbzyICmjBmXkMmWHPGYg9PJ-mICmjOCT2WB9iOGKQ0OsblBn5u4DOLqXLls3mojEBTvo/exec";


  const dateInput =
    document.getElementById("dateInput");

  const searchBtn =
    document.getElementById("searchBtn");

  const statusBox =
    document.getElementById("status");

  const updateTimeBox =
    document.getElementById("updateTime");

  const resultBody =
    document.getElementById("resultBody");


  //========================================================
  // Date → YYYY-MM-DD
  //========================================================

  function dateText(date) {

    const yyyy =
      date.getFullYear();

    const mm =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");

    const dd =
      String(
        date.getDate()
      ).padStart(2, "0");

    return (
      yyyy +
      "-" +
      mm +
      "-" +
      dd
    );

  }


  //========================================================
  // TODAY ~ TODAY+6
  //========================================================

  function setDateRange() {

    const today =
      new Date();

    const maxDate =
      new Date(today);

    maxDate.setDate(
      today.getDate() + 6
    );

    dateInput.min =
      dateText(today);

    dateInput.max =
      dateText(maxDate);

    dateInput.value =
      dateText(today);

  }


  //========================================================
  // HTML Escape
  //========================================================

  function esc(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  //========================================================
  // 비고 정리
  //
  // 줄바꿈 유지
  // 연속 빈 줄 압축
  // 앞뒤 불필요한 공백 제거
  //========================================================

  function cleanRemark(value) {

    return String(
      value || ""
    )
      .replace(
        /\r\n/g,
        "\n"
      )
      .replace(
        /\r/g,
        "\n"
      )
      .replace(
        /\n[ \t]*\n(?:[ \t]*\n)+/g,
        "\n\n"
      )
      .trim();

  }


  //========================================================
  // Cache 조회
  //========================================================

  async function getCache(date) {

    const url =
      BACKEND_URL +
      "?action=cache" +
      "&date=" +
      encodeURIComponent(date) +
      "&t=" +
      Date.now();

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return await response.json();

  }


  //========================================================
  // 정렬
  //
  // O 먼저
  //   → 예정시간 ETT
  //
  // X 나중
  //   → 계획시간 STT
  //========================================================

  function sortFlights(flights) {

    flights.sort((a, b) => {

      const aApplied =
        String(
          a.applied || ""
        ).trim();

      const bApplied =
        String(
          b.applied || ""
        ).trim();


      //====================================================
      // O → X 순서
      //====================================================

      if (
        aApplied !==
        bApplied
      ) {

        if (
          aApplied === "O"
        ) {
          return -1;
        }

        if (
          bApplied === "O"
        ) {
          return 1;
        }

        if (
          aApplied === "X"
        ) {
          return -1;
        }

        if (
          bApplied === "X"
        ) {
          return 1;
        }

        return aApplied.localeCompare(
          bApplied
        );

      }


      //====================================================
      // O → 예정시간
      //====================================================

      if (
        aApplied === "O"
      ) {

        return String(
          a.ett || ""
        ).localeCompare(
          String(
            b.ett || ""
          )
        );

      }


      //====================================================
      // X → 계획시간
      //====================================================

      if (
        aApplied === "X"
      ) {

        return String(
          a.stt || ""
        ).localeCompare(
          String(
            b.stt || ""
          )
        );

      }


      return 0;

    });

  }


  //========================================================
  // 결과 표시
  //========================================================

  function renderFlights(data) {

    const flights =
      Array.isArray(
        data.flights
      )
        ? [...data.flights]
        : [];


    //======================================================
    // 정렬
    //======================================================

    sortFlights(flights);


    //======================================================
    // 날짜별 갱신시간
    //======================================================

    updateTimeBox.textContent =
      data.updatedAt
        ? "최종 갱신: " +
          data.updatedAt
        : "최종 갱신: -";


    statusBox.textContent =
      (data.date || "") +
      " / " +
      flights.length +
      "건";


    //======================================================
    // 데이터 없음
    //======================================================

    if (
      flights.length === 0
    ) {

      resultBody.innerHTML = `

        <tr>

          <td
            colspan="18"
            class="empty"
          >
            해당 날짜 예약현황이 없습니다.
          </td>

        </tr>

      `;

      return;

    }


    //======================================================
    // 데이터 생성
    //======================================================

    resultBody.innerHTML =
      flights
        .map(f => {

          const applied =
            String(
              f.applied || ""
            ).trim();

          const tof =
            String(
              f.tof || ""
            ).trim();

          const company =
            String(
              f.company || ""
            ).trim();

          const remark =
            cleanRemark(
              f.remark
            );


          //==================================================
          // 조건부서식
          //==================================================

          const rowClasses = [];


          // X → 회색 배경
          if (
            applied === "X"
          ) {

            rowClasses.push(
              "flight-row-x"
            );

          }


          // 국제선 I → 파란 글씨
          if (
            tof === "I"
          ) {

            rowClasses.push(
              "flight-row-i"
            );

          }


          // SK 자가용 → 딥레드
          if (
            company ===
            "에스케이텔레콤(주)-자가용"
          ) {

            rowClasses.push(
              "flight-row-skt"
            );

          }


          const badgeClass =
            applied === "O"
              ? "badge-o"
              : "badge-x";


          return `

            <tr class="${rowClasses.join(" ")}">

              <td>
                <span
                  class="badge ${badgeClass}"
                >
                  ${esc(applied)}
                </span>
              </td>

              <td>
                ${esc(f.stt)}
              </td>

              <td>
                ${esc(f.ett)}
              </td>

              <td>
                ${esc(f.reg)}
              </td>

              <td>
                ${esc(f.type)}
              </td>

              <td>
                ${esc(f.nation)}
              </td>

              <td>
                ${esc(f.route)}
              </td>

              <td>
                ${esc(f.aod)}
              </td>

              <td>
                ${esc(f.tof)}
              </td>

              <td>
                ${esc(f.purpose)}
              </td>

              <td>
                ${esc(f.company)}
              </td>

              <td>
                ${esc(f.crew)}
              </td>

              <td>
                ${esc(f.pax)}
              </td>

              <td>
                ${esc(f.baggage)}
              </td>

              <td class="remark">
                ${esc(remark)}
              </td>

              <td>
                ${esc(f.cancel)}
              </td>

              <td>
                ${esc(f.stand)}
              </td>

              <td>
                ${esc(f.att)}
              </td>

            </tr>

          `;

        })
        .join("");

  }


  //========================================================
  // 조회
  //========================================================

  async function search() {

    const date =
      dateInput.value;


    if (!date) {

      alert(
        "조회할 날짜를 선택하세요."
      );

      return;

    }


    searchBtn.disabled =
      true;


    statusBox.textContent =
      "캐시 데이터를 불러오는 중...";


    try {

      const data =
        await getCache(date);


      if (!data.ok) {

        throw new Error(
          data.error ||
          "CACHE 조회 실패"
        );

      }


      //====================================================
      // 캐시 없음
      //====================================================

      if (
        data.status ===
        "NO_CACHE"
      ) {

        updateTimeBox.textContent =
          "최종 갱신: -";


        statusBox.textContent =
          "아직 이 날짜의 캐시가 없습니다.";


        resultBody.innerHTML = `

          <tr>

            <td
              colspan="18"
              class="empty"
            >
              Mini PC의 다음 캐시 갱신을 기다려주세요.
            </td>

          </tr>

        `;


        return;

      }


      renderFlights(data);


    } catch (err) {

      console.error(err);


      updateTimeBox.textContent =
        "최종 갱신: -";


      statusBox.textContent =
        "조회 오류: " +
        err.message;


      resultBody.innerHTML = `

        <tr>

          <td
            colspan="18"
            class="empty"
          >
            캐시 데이터를 가져오지 못했습니다.
          </td>

        </tr>

      `;


    } finally {

      searchBtn.disabled =
        false;

    }

  }


  //========================================================
  // 이벤트
  //========================================================

  /*
    날짜 변경만으로는 조회 안 함.
    조회 버튼 눌렀을 때만 실행.
  */

  searchBtn.addEventListener(
    "click",
    search
  );


  //========================================================
  // 최초 실행
  //========================================================

  setDateRange();

</script>

</body>

</html>
