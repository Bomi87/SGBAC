<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SGBAC 예약현황</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #f5f7fa;

      color: #222;

      font-size: 13px;

    }


    .container {

      width: 100%;

      max-width: 1800px;

      margin: 0 auto;

      padding: 14px;

    }


    h1 {

      margin:
        0 0 12px;

      font-size: 22px;

    }


    /*======================================================
      검색
    ======================================================*/

    .search-box {

      display: flex;

      gap: 8px;

      align-items: center;

      flex-wrap: wrap;

      background: #fff;

      padding: 10px 12px;

      border-radius: 8px;

      margin-bottom: 8px;

      border: 1px solid #ddd;

    }


    .search-box label {

      font-weight: 700;

    }


    input[type="date"] {

      height: 38px;

      padding:
        0 10px;

      font-size: 14px;

      border:
        1px solid #bbb;

      border-radius: 6px;

    }


    button {

      height: 38px;

      padding:
        0 18px;

      font-size: 14px;

      font-weight: 700;

      border: 0;

      border-radius: 6px;

      cursor: pointer;

      background: #2563eb;

      color: #fff;

    }


    button:hover {

      opacity: 0.92;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    /*======================================================
      정보
    ======================================================*/

    .info-box {

      display: flex;

      align-items: center;

      background: #fff;

      border:
        1px solid #ddd;

      border-radius: 8px;

      padding:
        8px 12px;

      margin-bottom: 8px;

      font-size: 13px;

      overflow-x: auto;

      white-space: nowrap;

    }


    .update-time {

      font-weight: 700;

    }


    .status {

      display: none;

    }


    /*======================================================
      테이블
    ======================================================*/

    .table-wrap {

      overflow-x: auto;

      background: #fff;

      border:
        1px solid #ddd;

      border-radius: 8px;

      -webkit-overflow-scrolling: touch;

    }


    table {

      width: max-content;

      min-width: 100%;

      border-collapse: collapse;

      table-layout: auto;

      font-size: 13px;

    }


    th,
    td {

      border-bottom:
        1px solid #e5e7eb;

      border-right:
        1px solid #eee;

      padding:
        6px 8px;

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

    }


    thead th {

      position: sticky;

      top: 0;

      background: #dce6f1;

      font-weight: 700;

      z-index: 2;

      height: 34px;

    }


    tbody td {

      padding-top: 6px;

      padding-bottom: 6px;

    }


    /*======================================================
      컬럼 폭
    ======================================================*/

    th.col-applied,
    td.col-applied {

      width: 58px;

      min-width: 58px;

    }


    th.col-time,
    td.col-time {

      width: 125px;

      min-width: 125px;

    }


    th.col-aircraft,
    td.col-aircraft {

      width: 90px;

      min-width: 90px;

    }


    th.col-route,
    td.col-route {

      width: 245px;

      min-width: 220px;

      text-align: left;

    }


    th.col-company,
    td.col-company {

      width: 170px;

      min-width: 140px;

    }


    th.col-personnel,
    td.col-personnel {

      width: 125px;

      min-width: 110px;

      text-align: left;

    }


    th.col-remark,
    td.col-remark {

      width: 520px;

      min-width: 420px;

      max-width: 600px;

      text-align: left;

    }


    th.col-cancel,
    td.col-cancel {

      width: 58px;

      min-width: 58px;

    }


    th.col-stand,
    td.col-stand {

      width: 58px;

      min-width: 58px;

    }


    th.col-att,
    td.col-att {

      width: 90px;

      min-width: 90px;

    }


    /*======================================================
      줄바꿈 데이터
    ======================================================*/

    .multiline {

      white-space: pre-line;

      line-height: 1.35;

    }


    .route-cell {

      white-space: pre-line;

      line-height: 1.4;

      text-align: left;

    }


    .aircraft-cell {

      white-space: pre-line;

      line-height: 1.35;

      font-weight: 600;

    }


    .time-cell {

      white-space: pre-line;

      line-height: 1.55;

      font-weight: 600;

    }


    .personnel-cell {

      white-space: pre-line;

      line-height: 1.45;

    }


    /*======================================================
      비고
    ======================================================*/

    td.remark {

      white-space: pre-line;

      word-break: break-word;

      overflow-wrap: anywhere;

      text-align: left;

      vertical-align: middle;

      line-height: 1.35;

      padding:
        7px 9px;

      font-size: 13px;

    }


    /*======================================================
      신청여부 버튼
    ======================================================*/

    .apply-button {

      display: inline-flex;

      width: 30px;

      height: 26px;

      align-items: center;

      justify-content: center;

      border: 0;

      border-radius: 6px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      padding: 0;

    }


    .apply-button-o {

      background: #dcfce7;

      color: #166534;

    }


    .apply-button-x {

      background: #fee2e2;

      color: #991b1b;

    }


    .apply-button:hover {

      filter: brightness(0.95);

    }


    /*======================================================
      X 행
    ======================================================*/

    .flight-row-x {

      background: #d9d9d9;

    }


    .flight-row-x td {

      background: transparent;

    }


    /*======================================================
      국제선
    ======================================================*/

    .flight-row-i {

      color: #0066cc;

    }


    .flight-row-i td {

      color: #0066cc;

    }


    /*======================================================
      SK 자가용
    ======================================================*/

    .flight-row-skt {

      color: #c62828 !important;

      font-weight: 600;

    }


    .flight-row-skt td {

      color: #c62828 !important;

    }


    .flight-row-skt .apply-button {

      color: #c62828 !important;

    }


    .flight-row-i.flight-row-skt td {

      color: #c62828 !important;

    }


    /*======================================================
      빈 데이터
    ======================================================*/

    .empty {

      padding: 28px;

      text-align: center;

      color: #666;

    }


    /*======================================================
      팝업
    ======================================================*/

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      background:
        rgba(0, 0, 0, 0.48);

      align-items: center;

      justify-content: center;

      padding: 18px;

    }


    .modal.show {

      display: flex;

    }


    .modal-box {

      width: 100%;

      max-width: 620px;

      max-height: 88vh;

      overflow-y: auto;

      background: #fff;

      border-radius: 12px;

      box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.25);

    }


    .modal-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        15px 18px;

      border-bottom:
        1px solid #eee;

    }


    .modal-title {

      margin: 0;

      font-size: 18px;

      font-weight: 700;

    }


    .modal-close {

      width: 34px;

      height: 34px;

      padding: 0;

      border-radius: 6px;

      background: #f1f3f5;

      color: #333;

      font-size: 20px;

      line-height: 34px;

    }


    .modal-content {

      padding: 16px 18px 20px;

    }


    .modal-row {

      display: grid;

      grid-template-columns: 70px 1fr;

      gap: 12px;

      padding:
        9px 0;

      border-bottom:
        1px solid #f0f0f0;

    }


    .modal-label {

      font-weight: 700;

      color: #555;

    }


    .modal-value {

      white-space: pre-line;

      word-break: break-word;

      line-height: 1.5;

      color: #222;

    }


    .modal-remark {

      margin-top: 14px;

      padding: 12px;

      background: #f7f8fa;

      border-radius: 8px;

      white-space: pre-line;

      word-break: break-word;

      line-height: 1.45;

      font-size: 13px;

    }


    .modal-remark-title {

      margin-bottom: 7px;

      font-weight: 700;

      color: #555;

    }


    /*======================================================
      모바일
    ======================================================*/

    @media (max-width: 700px) {

      body {

        font-size: 12px;

      }


      .container {

        padding: 8px;

      }


      h1 {

        font-size: 19px;

      }


      .search-box {

        align-items: stretch;

      }


      input[type="date"],
      .search-box > button {

        width: 100%;

      }


      .info-box {

        font-size: 12px;

      }


      table {

        font-size: 12px;

      }


      th,
      td {

        padding:
          5px 6px;

      }


      th.col-time,
      td.col-time {

        width: 120px;

        min-width: 120px;

      }


      th.col-route,
      td.col-route {

        width: 220px;

        min-width: 210px;

      }


      th.col-company,
      td.col-company {

        width: 150px;

        min-width: 130px;

      }


      th.col-personnel,
      td.col-personnel {

        width: 110px;

        min-width: 105px;

      }


      th.col-remark,
      td.col-remark {

        width: 400px;

        min-width: 360px;

        max-width: 450px;

      }


      td.remark {

        font-size: 12px;

        line-height: 1.35;

      }


      .modal {

        padding: 10px;

      }


      .modal-box {

        max-height: 92vh;

        border-radius: 10px;

      }


      .modal-header {

        padding:
          13px 14px;

      }


      .modal-content {

        padding:
          12px 14px 16px;

      }


      .modal-row {

        grid-template-columns: 62px 1fr;

        gap: 8px;

        padding:
          8px 0;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>SGBAC 예약현황</h1>


  <!--====================================================
      검색
  =====================================================-->

  <div class="search-box">

    <label for="dateInput">
      조회일
    </label>


    <input
      id="dateInput"
      type="date"
    >


    <button
      id="searchBtn"
    >
      조회
    </button>

  </div>


  <!--====================================================
      갱신정보
  =====================================================-->

  <div class="info-box">

    <div
      id="updateTime"
      class="update-time"
    >
      최종 갱신: -
    </div>


    <div
      id="status"
      class="status"
    >
    </div>

  </div>


  <!--====================================================
      테이블
  =====================================================-->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th class="col-applied">
            신청여부
          </th>

          <th class="col-time">
            시간
          </th>

          <th class="col-aircraft">
            항공기
          </th>

          <th class="col-route">
            구간
          </th>

          <th class="col-company">
            운항사
          </th>

          <th class="col-personnel">
            인원
          </th>

          <th class="col-remark">
            비고
          </th>

          <th class="col-cancel">
            취소여부
          </th>

          <th class="col-stand">
            주기장
          </th>

          <th class="col-att">
            실제시간
          </th>

        </tr>

      </thead>


      <tbody id="resultBody">

        <tr>

          <td
            colspan="10"
            class="empty"
          >
            조회 결과가 없습니다.
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>



<!--======================================================
    팝업
=======================================================-->

<div
  id="detailModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2
        class="modal-title"
      >
        예약 상세
      </h2>


      <button
        id="modalClose"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <div
      id="modalContent"
      class="modal-content"
    >
    </div>

  </div>

</div>



<script>


  //========================================================
  // Apps Script Backend
  //========================================================

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbzyICmjBmXkMmWHPGYg9PJ-mICmjOCT2WB9iOGKQ0OsblBn5u4DOLqXLls3mojEBTvo/exec";


  //========================================================
  // DOM
  //========================================================

  const dateInput =
    document.getElementById(
      "dateInput"
    );


  const searchBtn =
    document.getElementById(
      "searchBtn"
    );


  const statusBox =
    document.getElementById(
      "status"
    );


  const updateTimeBox =
    document.getElementById(
      "updateTime"
    );


  const resultBody =
    document.getElementById(
      "resultBody"
    );


  const detailModal =
    document.getElementById(
      "detailModal"
    );


  const modalContent =
    document.getElementById(
      "modalContent"
    );


  const modalClose =
    document.getElementById(
      "modalClose"
    );



  //========================================================
  // Date → YYYY-MM-DD
  //========================================================

  function dateText(date) {

    const yyyy =
      date.getFullYear();


    const mm =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const dd =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return (
      yyyy +
      "-" +
      mm +
      "-" +
      dd
    );

  }



  //========================================================
  // TODAY ~ TODAY+6
  //========================================================

  function setDateRange() {

    const today =
      new Date();


    const maxDate =
      new Date(
        today
      );


    maxDate.setDate(
      today.getDate() + 6
    );


    dateInput.min =
      dateText(
        today
      );


    dateInput.max =
      dateText(
        maxDate
      );


    dateInput.value =
      dateText(
        today
      );

  }



  //========================================================
  // HTML Escape
  //========================================================

  function esc(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }



  //========================================================
  // 비고 정리
  //========================================================

  function cleanRemark(value) {

    return String(
      value || ""
    )
      .replace(
        /\r\n/g,
        "\n"
      )
      .replace(
        /\r/g,
        "\n"
      )
      .replace(
        /\n[ \t]*\n(?:[ \t]*\n)+/g,
        "\n\n"
      )
      .trim();

  }



  //========================================================
  // 시간 표시
  //========================================================

  function kstTime(value) {

    const text =
      String(
        value || ""
      ).trim();


    if (!text) {

      return "";

    }


    return (
      text.endsWith("KST")
        ? text
        : text + " KST"
    );

  }



  //========================================================
  // 갱신시간 표시
  //
  // 최종 갱신:
  // 2026-08-29 17:35 KST /
  // DATA : 4건 추출(29AUG)
  //========================================================

  function formatUpdateDisplay(
    updatedAt,
    date,
    count
  ) {

    let displayTime = "";


    if (updatedAt) {

      const d =
        new Date(
          updatedAt
        );


      if (
        !isNaN(
          d.getTime()
        )
      ) {

        const yyyy =
          d.getFullYear();


        const mm =
          String(
            d.getMonth() + 1
          ).padStart(
            2,
            "0"
          );


        const dd =
          String(
            d.getDate()
          ).padStart(
            2,
            "0"
          );


        const hh =
          String(
            d.getHours()
          ).padStart(
            2,
            "0"
          );


        const min =
          String(
            d.getMinutes()
          ).padStart(
            2,
            "0"
          );


        displayTime =
          `${yyyy}-${mm}-${dd} ${hh}:${min} KST`;

      }

      else {

        displayTime =
          String(
            updatedAt
          );

      }

    }


    //======================================================
    // 조회일 → 29AUG
    //======================================================

    let shortDate = "";


    if (
      /^\d{4}-\d{2}-\d{2}$/.test(
        String(
          date || ""
        )
      )
    ) {

      const parts =
        String(
          date
        ).split("-");


      const day =
        parts[2];


      const monthNames = [

        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"

      ];


      const month =
        monthNames[
          Number(
            parts[1]
          ) - 1
        ];


      shortDate =
        `${day}${month}`;

    }


    return (

      "최종 갱신: " +

      (
        displayTime ||
        "-"
      ) +

      " / DATA : " +

      Number(
        count || 0
      ) +

      "건 추출" +

      (
        shortDate
          ? `(${shortDate})`
          : ""
      )

    );

  }



  //========================================================
  // CACHE 조회
  //========================================================

  async function getCache(date) {

    const url =
      BACKEND_URL +
      "?action=cache" +
      "&date=" +
      encodeURIComponent(
        date
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    return await response.json();

  }



  //========================================================
  // 정렬
  //
  // O → X
  // O → 예정시간
  // X → 계획시간
  //========================================================

  function sortFlights(
    flights
  ) {

    flights.sort(
      (a, b) => {

        const aa =
          String(
            a.applied || ""
          ).trim();


        const bb =
          String(
            b.applied || ""
          ).trim();


        if (
          aa !== bb
        ) {

          if (
            aa === "O"
          ) {
            return -1;
          }


          if (
            bb === "O"
          ) {
            return 1;
          }


          if (
            aa === "X"
          ) {
            return 1;
          }


          if (
            bb === "X"
          ) {
            return -1;
          }


          return aa.localeCompare(
            bb
          );

        }


        if (
          aa === "O"
        ) {

          return String(
            a.ett || ""
          ).localeCompare(
            String(
              b.ett || ""
            )
          );

        }


        if (
          aa === "X"
        ) {

          return String(
            a.stt || ""
          ).localeCompare(
            String(
              b.stt || ""
            )
          );

        }


        return 0;

      }
    );

  }



  //========================================================
  // 구간 표시
  //
  // BSL-GMP / 국제선 도착
  // (상대공항: 스위스)
  // *인원수송
  //========================================================

  function makeRouteText(f) {

    const route =
      String(
        f.route || ""
      ).trim();


    const tof =
      String(
        f.tof || ""
      ).trim()
      .toUpperCase();


    const aod =
      String(
        f.aod || ""
      ).trim()
      .toUpperCase();


    const nation =
      String(
        f.nation || ""
      ).trim();


    const purpose =
      String(
        f.purpose || ""
      ).trim();


    let typeText = "";


    if (
      tof === "I"
    ) {

      if (
        aod === "A"
      ) {

        typeText =
          "국제선 도착";

      }

      else if (
        aod === "D"
      ) {

        typeText =
          "국제선 출발";

      }

      else {

        typeText =
          "국제선";

      }

    }

    else {

      if (
        aod === "A"
      ) {

        typeText =
          "국내선 도착";

      }

      else if (
        aod === "D"
      ) {

        typeText =
          "국내선 출발";

      }

      else {

        typeText =
          "국내선";

      }

    }


    let result =
      route;


    if (
      typeText
    ) {

      result +=
        " / " +
        typeText;

    }


    if (
      nation
    ) {

      result +=
        "\n(상대공항: " +
        nation +
        ")";

    }


    if (
      purpose
    ) {

      result +=
        "\n*" +
        purpose;

    }


    return result;

  }



  //========================================================
  // 항공기
  //
  // HL8372
  // (GLF6)
  //========================================================

  function makeAircraftText(f) {

    const reg =
      String(
        f.reg || ""
      ).trim();


    const type =
      String(
        f.type || ""
      ).trim();


    if (
      reg &&
      type
    ) {

      return (
        reg +
        "\n(" +
        type +
        ")"
      );

    }


    return (
      reg ||
      type ||
      ""
    );

  }



  //========================================================
  // 시간
  //
  // -계획: 07:10 KST
  // -예정: 07:30 KST
  //========================================================

  function makeTimeText(f) {

    const stt =
      kstTime(
        f.stt
      );


    const ett =
      kstTime(
        f.ett
      );


    let result = "";


    if (stt) {

      result +=
        "-계획: " +
        stt;

    }


    if (ett) {

      if (result) {

        result += "\n";

      }


      result +=
        "-예정: " +
        ett;

    }


    return result;

  }



  //========================================================
  // 인원
  //
  // -승무원 : 4
  // -승객: 0
  // -수화물: 4
  //
  // 실제 데이터만 사용
  //========================================================

  function makePersonnelText(f) {

    const crew =
      f.crew !== undefined &&
      f.crew !== null
        ? f.crew
        : "";


    const pax =
      f.pax !== undefined &&
      f.pax !== null
        ? f.pax
        : "";


    const baggage =
      f.baggage !== undefined &&
      f.baggage !== null
        ? f.baggage
        : "";


    return (

      "-승무원 : " +
      crew +

      "\n" +

      "-승객: " +
      pax +

      "\n" +

      "-수화물: " +
      baggage

    );

  }



  //========================================================
  // 팝업
  //========================================================

  function openDetail(
    f
  ) {

    const time =
      makeTimeText(
        f
      );


    const aircraft =
      makeAircraftText(
        f
      );


    const route =
      makeRouteText(
        f
      );


    const company =
      String(
        f.company || ""
      ).trim();


    const personnel =
      makePersonnelText(
        f
      );


    const remark =
      cleanRemark(
        f.remark
      );


    modalContent.innerHTML = `

      <div class="modal-row">

        <div class="modal-label">
          시간
        </div>

        <div class="modal-value">
          ${esc(time)}
        </div>

      </div>


      <div class="modal-row">

        <div class="modal-label">
          항공기
        </div>

        <div class="modal-value">
          ${esc(aircraft)}
        </div>

      </div>


      <div class="modal-row">

        <div class="modal-label">
          구간
        </div>

        <div class="modal-value">
          ${esc(route)}
        </div>

      </div>


      <div class="modal-row">

        <div class="modal-label">
          운항사
        </div>

        <div class="modal-value">
          ${esc(company)}
        </div>

      </div>


      <div class="modal-row">

        <div class="modal-label">
          인원
        </div>

        <div class="modal-value">
          ${esc(personnel)}
        </div>

      </div>


      <div class="modal-remark">

        <div class="modal-remark-title">
          비고
        </div>

        ${esc(
          remark || "-"
        )}

      </div>

    `;


    detailModal.classList.add(
      "show"
    );


    document.body.style.overflow =
      "hidden";

  }



  //========================================================
  // 팝업 닫기
  //========================================================

  function closeDetail() {

    detailModal.classList.remove(
      "show"
    );


    document.body.style.overflow =
      "";

  }


  modalClose.addEventListener(
    "click",
    closeDetail
  );


  detailModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        detailModal
      ) {

        closeDetail();

      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeDetail();

      }

    }
  );



  //========================================================
  // 결과 표시
  //========================================================

  function renderFlights(
    data
  ) {

    const flights =
      Array.isArray(
        data.flights
      )
        ? [...data.flights]
        : [];


    //======================================================
    // 정렬
    //======================================================

    sortFlights(
      flights
    );


    //======================================================
    // 갱신시간
    //======================================================

    updateTimeBox.textContent =
      formatUpdateDisplay(
        data.updatedAt,
        data.date,
        flights.length
      );


    statusBox.textContent =
      "";


    //======================================================
    // 데이터 없음
    //======================================================

    if (
      flights.length === 0
    ) {

      resultBody.innerHTML = `

        <tr>

          <td
            colspan="10"
            class="empty"
          >
            해당 날짜 예약현황이 없습니다.
          </td>

        </tr>

      `;

      return;

    }


    //======================================================
    // 렌더링
    //======================================================

    resultBody.innerHTML =
      flights
        .map(
          (f, index) => {


            const applied =
              String(
                f.applied || ""
              ).trim();


            const tof =
              String(
                f.tof || ""
              ).trim()
              .toUpperCase();


            const company =
              String(
                f.company || ""
              ).trim();


            const remark =
              cleanRemark(
                f.remark
              );


            //================================================
            // 조건부서식
            //================================================

            const rowClasses = [];


            // X → 회색
            if (
              applied === "X"
            ) {

              rowClasses.push(
                "flight-row-x"
              );

            }


            // 국제선 → 파란색
            if (
              tof === "I"
            ) {

              rowClasses.push(
                "flight-row-i"
              );

            }


            // SK 자가용 → 빨간색
            if (
              company ===
              "에스케이텔레콤(주)-자가용"
            ) {

              rowClasses.push(
                "flight-row-skt"
              );

            }


            const buttonClass =
              applied === "O"
                ? "apply-button-o"
                : "apply-button-x";


            const aircraftText =
              makeAircraftText(
                f
              );


            const routeText =
              makeRouteText(
                f
              );


            const timeText =
              makeTimeText(
                f
              );


            const personnelText =
              makePersonnelText(
                f
              );


            return `

              <tr
                class="${rowClasses.join(" ")}"
              >


                <!-- 신청여부 -->

                <td
                  class="col-applied"
                >

                  <button
                    type="button"
                    class="
                      apply-button
                      ${buttonClass}
                    "
                    data-index="${index}"
                  >
                    ${esc(
                      applied
                    )}
                  </button>

                </td>


                <!-- 시간 -->

                <td
                  class="
                    col-time
                    time-cell
                  "
                >
                  ${esc(
                    timeText
                  )}
                </td>


                <!-- 항공기 -->

                <td
                  class="
                    col-aircraft
                    aircraft-cell
                  "
                >
                  ${esc(
                    aircraftText
                  )}
                </td>


                <!-- 구간 -->

                <td
                  class="
                    col-route
                    route-cell
                  "
                >
                  ${esc(
                    routeText
                  )}
                </td>


                <!-- 운항사 -->

                <td
                  class="col-company"
                >
                  ${esc(
                    company
                  )}
                </td>


                <!-- 인원 -->

                <td
                  class="
                    col-personnel
                    personnel-cell
                  "
                >
                  ${esc(
                    personnelText
                  )}
                </td>


                <!-- 비고 -->

                <td
                  class="
                    col-remark
                    remark
                  "
                >
                  ${esc(
                    remark
                  )}
                </td>


                <!-- 취소여부 -->

                <td
                  class="col-cancel"
                >
                  ${esc(
                    f.cancel
                  )}
                </td>


                <!-- 주기장 -->

                <td
                  class="col-stand"
                >
                  ${esc(
                    f.stand
                  )}
                </td>


                <!-- 실제시간 -->

                <td
                  class="col-att"
                >
                  ${esc(
                    kstTime(
                      f.att
                    )
                  )}
                </td>


              </tr>

            `;

          }
        )
        .join("");


    //======================================================
    // O/X 버튼 이벤트
    //======================================================

    const buttons =
      resultBody.querySelectorAll(
        ".apply-button"
      );


    buttons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              Number(
                button.dataset.index
              );


            const flight =
              flights[index];


            if (
              flight
            ) {

              openDetail(
                flight
              );

            }

          }
        );

      }
    );

  }



  //========================================================
  // 조회
  //========================================================

  async function search() {

    const date =
      dateInput.value;


    if (!date) {

      alert(
        "조회할 날짜를 선택하세요."
      );

      return;

    }


    searchBtn.disabled =
      true;


    statusBox.textContent =
      "캐시 데이터를 불러오는 중...";


    try {

      const data =
        await getCache(
          date
        );


      if (
        !data.ok
      ) {

        throw new Error(
          data.error ||
          "CACHE 조회 실패"
        );

      }


      //====================================================
      // 캐시 없음
      //====================================================

      if (
        data.status ===
        "NO_CACHE"
      ) {

        updateTimeBox.textContent =
          "최종 갱신: -";


        statusBox.textContent =
          "아직 이 날짜의 캐시가 없습니다.";


        resultBody.innerHTML = `

          <tr>

            <td
              colspan="10"
              class="empty"
            >
              Mini PC의 다음 캐시 갱신을 기다려주세요.
            </td>

          </tr>

        `;


        return;

      }


      renderFlights(
        data
      );


    } catch (err) {

      console.error(
        err
      );


      updateTimeBox.textContent =
        "최종 갱신: -";


      statusBox.textContent =
        "조회 오류: " +
        err.message;


      resultBody.innerHTML = `

        <tr>

          <td
            colspan="10"
            class="empty"
          >
            캐시 데이터를 가져오지 못했습니다.
          </td>

        </tr>

      `;


    } finally {

      searchBtn.disabled =
        false;

    }

  }



  //========================================================
  // 이벤트
  //========================================================

  searchBtn.addEventListener(
    "click",
    search
  );


  //========================================================
  // 최초 실행
  //========================================================

  setDateRange();

</script>
